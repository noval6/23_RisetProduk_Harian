<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riset Produk Harian - LebihCakep</title>
<style>
:root{--bg:#0b0b0f;--card:#15151c;--card2:#1c1c26;--border:#2a2a36;--text:#f2f2f5;--muted:#9a9aad;--accent:#ff7a1a;--accent2:#ffb703;--green:#3ddc84;--red:#ff5c5c;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:32px 16px 24px}
header h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--muted);font-size:.85rem;margin-top:6px}
.stats-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0 24px}
.stat-pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:.8rem;color:var(--muted)}
.stat-pill b{color:var(--text)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 18px;font-size:.82rem;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:all .25s;position:relative}
.product-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,122,26,.08)}
.card-rank{position:absolute;top:14px;right:16px;background:var(--card2);border-radius:8px;padding:2px 10px;font-size:.72rem;color:var(--muted);font-weight:600}
.card-fire{position:absolute;top:14px;left:16px;font-size:1.1rem}
.card-name{font-size:.92rem;font-weight:600;margin-bottom:8px;padding-right:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-seller{font-size:.78rem;color:var(--muted);margin-bottom:12px}
.card-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--card2);border-radius:8px;padding:8px 10px}
.metric-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.metric-value{font-size:.88rem;font-weight:600;margin-top:2px}
.metric-value.green{color:var(--green)}
.metric-value.red{color:var(--red)}
.metric-value.blue{color:var(--blue)}
.metric-value.orange{color:var(--accent)}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:var(--card2);border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--text);background:var(--border)}
.modal h2{font-size:1.1rem;font-weight:700;margin-bottom:4px;padding-right:40px}
.modal .seller{color:var(--muted);font-size:.82rem;margin-bottom:16px}
.modal .metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.modal .flag-note{background:rgba(255,122,26,.08);border:1px solid rgba(255,122,26,.2);border-radius:10px;padding:12px 14px;font-size:.8rem;color:var(--accent2);margin-bottom:18px;line-height:1.5}
.modal .inv-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.25);border-radius:8px;padding:6px 12px;font-size:.8rem;color:var(--green);margin-bottom:16px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:600;text-decoration:none;transition:all .2s;border:none;cursor:pointer}
.btn-kalodata{background:var(--accent);color:#fff}
.btn-kalodata:hover{background:#e86c10}
.btn-tiktok{background:var(--card2);border:1px solid var(--border);color:var(--text)}
.btn-tiktok:hover{border-color:var(--accent);color:var(--accent)}
.cat-note{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:.8rem;color:var(--muted);margin-bottom:16px;line-height:1.5}
footer{text-align:center;padding:32px 16px;color:var(--muted);font-size:.75rem}
@media(max-width:600px){.grid{grid-template-columns:1fr}.modal .metrics-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

const CATEGORIES = [...new Set(DATA.map(d=>d.cat))];
const CAT_NOTES = {
  "Kacamata Pria": "Seluruh kategori Kacamata sedang tren turun bulan ini. Seleksi ini prioritas revenue + konversi tertinggi, bukan growth.",
  "Skincare Pria": "Beberapa produk growth negatif tapi revenue & konversi kreator tetap kuat. Dicatat sebagai flag per produk."
};

let activeCat = CATEGORIES[0];

function init(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = CATEGORIES.map(c=>`<div class="tab${c===activeCat?' active':''}" onclick="switchCat('${c}')">${c}</div>`).join('');
  renderGrid();
}

function switchCat(cat){
  activeCat = cat;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active',t.textContent===cat);
  });
  renderGrid();
}

function renderGrid(){
  const items = DATA.filter(d=>d.cat===activeCat);
  const noteEl = document.getElementById('catNote');
  if(CAT_NOTES[activeCat]){
    noteEl.innerHTML=`<div class="cat-note">${CAT_NOTES[activeCat]}</div>`;
  } else {
    noteEl.innerHTML='';
  }
  const gridEl = document.getElementById('grid');
  gridEl.innerHTML = items.map((p,i)=>{
    const growthClass = p.growth>=0?'green':'red';
    const growthSign = p.growth>=0?'+':'';
    return `<div class="product-card" onclick="openModal(${DATA.indexOf(p)})">
      ${p.inInventory?'<span class="card-fire" title="Ada di inventory!">&#128293;</span>':''}
      <span class="card-rank">#${i+1}</span>
      <div class="card-name">${p.name}</div>
      <div class="card-seller">${p.seller}</div>
      <div class="card-metrics">
        <div class="metric"><div class="metric-label">Revenue 30hr</div><div class="metric-value blue">${p.revenue}</div></div>
        <div class="metric"><div class="metric-label">Komisi</div><div class="metric-value orange">${p.komisi}%</div></div>
        <div class="metric"><div class="metric-label">Growth 30hr</div><div class="metric-value ${growthClass}">${growthSign}${p.growth}%</div></div>
        <div class="metric"><div class="metric-label">Konversi</div><div class="metric-value">${p.konversi}%</div></div>
      </div>
    </div>`;
  }).join('');
}

function openModal(idx){
  const p = DATA[idx];
  const growthClass = p.growth>=0?'green':'red';
  const growthSign = p.growth>=0?'+':'';
  const m = document.getElementById('modal');
  m.innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>${p.inInventory?'&#128293; ':''}${p.name}</h2>
    <div class="seller">${p.seller} &middot; ${p.cat}</div>
    ${p.inInventory?'<div class="inv-badge">&#128293; Ada di Inventory LebihCakep</div>':''}
    <div class="metrics-grid">
      <div class="metric"><div class="metric-label">Harga</div><div class="metric-value">${p.price}</div></div>
      <div class="metric"><div class="metric-label">Avg Price</div><div class="metric-value">${p.avgPrice}</div></div>
      <div class="metric"><div class="metric-label">Komisi</div><div class="metric-value orange">${p.komisi}%</div></div>
      <div class="metric"><div class="metric-label">Growth 30hr</div><div class="metric-value ${growthClass}">${growthSign}${p.growth}%</div></div>
      <div class="metric"><div class="metric-label">Konversi Kreator</div><div class="metric-value">${p.konversi}%</div></div>
      <div class="metric"><div class="metric-label">Revenue 30hr</div><div class="metric-value blue">${p.revenue}</div></div>
    </div>
    ${p.flag?`<div class="flag-note">${p.flag}</div>`:''}
    <div class="btn-row">
      <a href="${p.link}" target="_blank" class="btn btn-kalodata">&#128202; Buka di Kalodata</a>
      <a href="${p.tiktokLink}" target="_blank" class="btn btn-tiktok">&#127989; Buka di TikTok Shop</a>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape') closeModal();});

init();
</script>
</body>
</html>
